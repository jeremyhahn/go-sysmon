version: "2"

linters:
  enable:
    # errname holds the handbook's error naming (errors.md section 1): a type
    # implementing error is named *Error, and a sentinel error value is named
    # Err*. It is the guard that keeps an Err*-named struct type from coming
    # back after #194 renamed them all.
    - errname
    # forbidigo keeps errors.New and fmt.Errorf out of production code. Every
    # error there is a named type (CLAUDE.md), so there are no sentinel values
    # and no inline errors: the one sentinel and the handful of fmt.Errorf
    # wraps became types with the guard (#194). Test code may still build a
    # throwaway cause inline, as the handbook permits (errors.md section 2);
    # see the exclusion below.
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^errors\.New$
          msg: declare a named error type instead; production code has no sentinel or inline errors
        - pattern: ^fmt\.Errorf$
          msg: declare a named error type instead; production code has no sentinel or inline errors
    errcheck:
      # An error assigned to the blank identifier is still a discarded error:
      # `_ = f.Close()` and `v, _ := strconv.Atoi(s)` are reported like a bare
      # `f.Close()`. Test code gets no exception (#196) -- a test that drops the
      # error from its own cleanup or its own fake server can pass over the very
      # failure it exists to catch.
      check-blank: true
      # The fmt.Fprint family is excluded because every renderer writes through
      # pkg/cli.errWriter, which records the first write error and short-circuits
      # the rest; each Render* function returns that error to its caller. Checking
      # 130+ individual Fprintf calls would add no coverage over what errWriter
      # already reports. See pkg/cli/errwriter.go.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    # Generated and vendored trees are not ours to lint.
    generated: lax
    rules:
      # A test may build a throwaway cause with errors.New or fmt.Errorf; the
      # typed-error rule binds the code a caller receives errors from.
      - path: _test\.go$
        linters:
          - forbidigo
    presets:
      - comments
    # NOT the std-error-handling preset. It exempts every Close, Flush,
    # os.Remove and Setenv from errcheck in every file, which is how fifteen
    # unchecked `defer resp.Body.Close()` sat in the test suite unreported
    # (#196), and two dozen discarded errors in production code (#207).
    # errcheck has no exclusion rules at all: production and test code are
    # held to the same bar, and scripts/check-nolint.sh rejects the //nolint
    # directive that would be the way around it (and around errname and
    # forbidigo).

issues:
  # golangci-lint caps its report by default: three findings of the same text,
  # fifty per linter. A capped run exits non-zero but hides the rest, so a fix
  # that clears the shown findings reveals new ones on the next run (#212 found
  # ten errcheck findings through a report that showed five). Zero lifts both
  # caps: every run reports every finding.
  max-issues-per-linter: 0
  max-same-issues: 0
