name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel superseded runs on the same branch; only the newest matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The go.mod toolchain directive pins the exact compiler, including the
  # patched standard library. Reading the version from go.mod keeps CI on
  # whatever the project declares rather than a separately drifting constant.
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '24'

jobs:
  lint:
    name: Format, Vet & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

      # gofmt and vet are separate targets so a formatting failure is
      # distinguishable from a lint finding in the job log.
      - run: make fmt-check
      - run: make vet
      - run: make lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Covers dependencies and the standard library the project links against.
      # A regression in the go.mod toolchain pin fails here.
      - name: Go vulnerability scan
        run: make vulncheck

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: cmd/sysmon/frontend
        run: npm ci

      - name: Frontend vulnerability scan
        run: make audit

      # Runs via the Makefile rather than the gosec action so the rule policy
      # (which exclusions, and why) lives in one place that `make ci` also uses.
      # With the action, CI and local runs drift the moment either changes.
      - name: Static analysis (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          make gosec

  test:
    name: Unit Tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # CGO is required: pkg/collector imports NVIDIA go-nvml, which does not
      # build with CGO_ENABLED=0. The unit suite runs under -race because two
      # real data races shipped undetected while it did not.
      - name: Run unit tests
        run: make test

      - name: Coverage report
        run: |
          go test ./pkg/... ./cmd/... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -20

      # actions/upload-artifact@v7 refuses to run against any server that is
      # not github.com -- it detects one and reports "not currently supported
      # on GHES". Gitea presents as such, so this step is GitHub-only. The
      # job's real work has already happened by this point; only the artifact
      # is skipped.
      - uses: actions/upload-artifact@v7
        if: github.server_url == 'https://github.com'
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  extensions:
    name: Desktop Extension Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Tiers 1 and 2: the shared modules' unit tests, plus a harness that
      # loads applet.js against stand-in GObject Introspection objects. Both
      # run in-process and need no display. Tier 3 stands up a real Cinnamon
      # session and is too slow for every push -- see the nightly workflow.
      - name: Run extension tests
        run: make test-extensions

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      # The desktop build links GTK and WebKit; the server build does not.
      # Both are built here so a break in either is caught before release.
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build everything
        run: make build

      - name: Verify the server binary runs
        run: |
          ./bin/sysmon-server version
          ./bin/sysmon-server doctor || true

      # actions/upload-artifact@v7 refuses to run against any server that is
      # not github.com -- it detects one and reports "not currently supported
      # on GHES". Gitea presents as such, so this step is GitHub-only. The
      # job's real work has already happened by this point; only the artifact
      # is skipped.
      - uses: actions/upload-artifact@v7
        if: github.server_url == 'https://github.com'
        with:
          name: binaries
          path: bin/
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      # Runs inside the container image so smartmontools and dmidecode are
      # present, matching how the suite runs locally.
      - name: Run integration tests
        run: make integration-test

  e2e:
    name: Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      - name: Install browser dependencies
        working-directory: cmd/sysmon/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: make test-e2e

      # actions/upload-artifact@v7 refuses to run against any server that is
      # not github.com -- it detects one and reports "not currently supported
      # on GHES". Gitea presents as such, so this step is GitHub-only. The
      # job's real work has already happened by this point; only the artifact
      # is skipped.
      - uses: actions/upload-artifact@v7
        if: failure() && github.server_url == 'https://github.com'
        with:
          name: playwright-report
          path: cmd/sysmon/frontend/test-results/
          retention-days: 7

  # Builds the image on every push without publishing it, so a broken
  # Dockerfile is caught here rather than at tag time when a release is
  # already half-built.
  image:
    name: Container Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # type=gha is the GitHub Actions cache service. Gitea runs its own, but
      # the job container cannot reach the address act_runner advertises, and
      # buildx fails the whole build on a cache timeout rather than carrying on
      # without it. The cache is an optimisation, so it is switched off where
      # it does not work instead of costing us the job.
      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: go-sysmon:ci
          cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
          cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}

      # Trivy runs from its own image rather than an action: actions that
      # install themselves through a nested checkout resolve against whichever
      # server is running the job, so they work on GitHub and fail on a
      # self-hosted runner. This behaves the same on both.
      - name: Scan the image and its binaries
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --no-progress \
              --format json \
              go-sysmon:ci > trivy-results.json

      # Findings with a fix available fail the build; findings the distribution
      # has not patched are reported and do not. Blocking on unfixable CVEs
      # would wedge every build on something no change of ours can resolve,
      # which teaches everyone to ignore the scanner.
      # Findings with a fix available fail the build; findings the distribution
      # has not patched are reported and do not. Blocking on unfixable CVEs
      # would wedge every build on something no change of ours can resolve,
      # which teaches everyone to ignore the scanner.
      - name: Fail on fixable findings
        run: python3 scripts/trivy-gate.py trivy-results.json

      # A container that starts but cannot see the host is the failure mode
      # worth catching, so this asserts on what it actually reports.
      - name: Verify it sees the host
        run: |
          docker run --rm --pid=host --network=host \
            -v /sys:/sys:ro -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            go-sysmon:ci --json > /tmp/snap.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/snap.json'))
          procs = d['processes']['total']
          cpus = len(d['cpus'])
          assert procs > 5, f"only {procs} processes: --pid=host is not working"
          assert cpus > 0, "no CPUs reported"
          print(f"OK: {procs} processes, {cpus} cpus, host={d['host']['hostname']}")
          PY

  # A single required check for branch protection. Adding a job means adding it
  # to BOTH `needs` and the results line below -- the object-filter shortcut
  # that avoided this is unusable, see the comment on the step.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [lint, security, test, extensions, build, image, integration, e2e]
    if: always()
    steps:
      # Each job is listed explicitly rather than using join(needs.*.result).
      # That object filter is a GitHub extension: on Gitea it evaluates to an
      # EMPTY STRING, so the grep below matched nothing and this gate reported
      # "All CI jobs succeeded" while Browser Tests had failed. A gate that
      # passes vacuously is worse than no gate at all.
      #
      # The empty check is the backstop: if the results cannot be read on some
      # future runner either, this fails rather than waving the run through.
      #
      # Expression strings must also be single-quoted -- GitHub rejects double
      # quotes and invalidates the whole file before any job starts.
      - name: Verify every job succeeded
        run: |
          results="${{ needs.lint.result }},${{ needs.security.result }},${{ needs.test.result }},${{ needs.extensions.result }},${{ needs.build.result }},${{ needs.image.result }},${{ needs.integration.result }},${{ needs.e2e.result }}"
          echo "job results: ${results}"

          if [ -z "${results//,/}" ]; then
            echo "Could not read any job results. Refusing to report success."
            exit 1
          fi
          if echo "${results}" | grep -qE 'failure|cancelled'; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All CI jobs succeeded."
