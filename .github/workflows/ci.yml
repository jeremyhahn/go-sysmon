name: CI

on:
  push:
    # main is the only trunk (the server has no master or develop).
    # automerge.yml's merge trains are PRs from merge-train/* and get CI from
    # pull_request, so push needs no other branch (ci-template v1.15, #237).
    branches: [main]
  pull_request:
    branches: [main]
    # The default types only: never `labeled` or `unlabeled`. train-pr puts
    # every label on a PR in its create call, and Gitea 1.27.1 turns each
    # label add or remove into a `labeled` event, so those types would start
    # a run per label. `ci:full` counts when it is on the PR at open; a full
    # run on an open PR goes through workflow_dispatch.
  workflow_dispatch:

# Two tiers (#267, handbook ci-standard.md §8, docs/testing/ci-tiers.md). The
# PR tier -- lint, build, bundle currency and the unit suite under -race --
# runs on every event. The full tier adds security analysis, FIPS,
# integration, browser, desktop extension and container image jobs, and runs
# on a push to main, on workflow_dispatch, and on a PR labelled `ci:full`.
# Each full-tier job and the gate repeat one test:
#
#   github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
#
# The labels are read from the PR, never from github.event.label.name: Gitea
# 1.27 sends `label_updated` with no label object, so that name is always empty.
# No `schedule:`: the coordinator dispatches nightly runs.

# Shed superseded runs instead of letting them finish. gpu-host's act_runner is
# capacity 3 for the whole portfolio, so a run whose head has already moved on is
# occupying a slot a live run needs. Keyed on the ref, so each branch supersedes
# only itself; `desktop.yml` has carried the same workflow-level block in
# production since #104 and `opencode-review.yml` keys on the PR number.
#
# `cancel-in-progress` is the LITERAL `true`. Gitea 1.27.1 does not evaluate
# expressions in that field -- any non-empty value is truthy -- so an expression
# there reads as "always cancel" no matter what it would have computed.
#
# A run on main is keyed on its event and commit sha, so it has a group of
# its own and a merge never cancels it: a merge to main must always finish its CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

env:
  # The go directive in go.mod pins the exact compiler, including the patched
  # standard library (there is no separate toolchain directive). Reading the
  # version from go.mod keeps CI on whatever the project declares rather than a
  # separately drifting constant.
  GO_VERSION_FILE: go.mod
  # .node-version pins the exact Node.js release (the latest LTS), the same
  # way go.mod pins Go; the Dockerfile's node image repeats it, and
  # `make check-pins` fails if the two disagree.
  NODE_VERSION_FILE: .node-version

jobs:
  lint:
    name: Format, Vet & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scans below can walk the commits this PR adds,
          # not merely the tree it ends at. Both need it, for the same reason
          # from opposite directions: the conflict-marker contamination in #40
          # was six commits deep under a CLEAN HEAD, and signed commits are
          # enforced on main only through a Gitea squash -- a new commit Gitea
          # signs itself -- so that enforcement never sees a branch's own
          # commits (#41). A shallow clone would leave both scans reporting a
          # pass, or SKIPPED forever, for exactly the cases they exist to catch.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # Tool versions are pinned once, in the Makefile, and `make lint` refuses
      # any other build. The runner image bakes the tools: a baked copy at the
      # pinned version is used as-is, with nothing fetched -- network installs
      # on every run failed this job twice in one day on a sum.golang.org
      # timeout (#39) and downgraded the image's linter (#21). A copy at any
      # other version, or none (GitHub's hosted `ubuntu-latest`), gets the pin
      # installed into GOBIN, so every runner runs the tools a developer runs.
      - name: Analysis tools
        run: make tool-golangci-lint tool-actionlint

      # `make vet`, `make lint` and `make test` run in every build shape the
      # project ships (the Makefile's BUILD_SHAPES), and the desktop shapes link
      # GTK and WebKit -- so this job needs the packages the Build job installs.
      # Without them the desktop build's own files are compiled by no gate,
      # which is how its test files stopped compiling unseen (#204).
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # `make lint` type-checks the Playwright specs and the build configuration
      # (check-ts, #196, #209), which needs the TypeScript compiler from the
      # frontend's own lockfile. Through make, so the install stamp exists and
      # lint does not repeat the install.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-deps

      # gofmt and vet are separate targets so a formatting failure is
      # distinguishable from a lint finding in the job log.
      - run: make fmt-check
      - run: make vet

      # The base is passed explicitly so the conflict-marker scan can walk the
      # commits this PR adds. On a push to main there is no pull_request
      # context, the variable is empty, and the scan reports the history half as
      # SKIPPED rather than as a pass -- which is the distinction #40 is about.
      # Named separately from `make lint`, which also runs it: this property is
      # what an external consumer depends on (#8 -- go-quicbaas needs
      # CGO_ENABLED=0 GOFIPS140=latest), and a failure attributed to "Format, Vet
      # & Lint" would not say that. The second run is cache-warm and instant.
      - name: Static build (no cgo), for consumers embedding pkg/collector
        run: make check-cgo-clean

      - run: make lint
        env:
          CONFLICT_SCAN_BASE: ${{ github.event.pull_request.base.sha }}

      # Its own step so a signing failure is named in the job list rather than
      # buried in lint output. On a push to main there is no pull_request
      # context, the base is empty, and the scan reports SKIPPED -- correctly,
      # since main's own commits are what branch protection already verifies.
      - name: Signed commits
        run: make check-signed
        env:
          SIGNED_SCAN_BASE: ${{ github.event.pull_request.base.sha }}

  security:
    name: Security Scan
    # Full tier.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    # No `needs`: every job starts at once and CI Passed fails closed on any
    # of them (ci-template v1.14/v1.15, #237).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # gosec and govulncheck are pinned in the Makefile with the others. They
      # were installed with @latest once, which is what made scan results
      # unreproducible: a scan that cannot say which version produced it
      # cannot be compared with the one before it. `make tool-*` prints the
      # version it verified, so every scan names its scanner.
      #
      # AFTER setup-go, not before: a missing or stale tool is `go install`-ed,
      # and before setup-go that is whatever Go the host happens to carry --
      # or none. A security gate must not depend on an unmanaged toolchain, and
      # the lint and release jobs already had this order.
      - name: Analysis tools
        run: make tool-govulncheck tool-gosec

      # Both scans run in every build shape, and the desktop shapes link GTK and
      # WebKit.
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # Covers dependencies and the standard library the project links against.
      # A regression in the go directive (the toolchain pin) fails here.
      - name: Go vulnerability scan
        run: make vulncheck

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: cmd/sysmon/frontend
        run: npm ci

      # NON-BLOCKING by owner ruling 2026-09-16, and the two reasons it can come
      # back non-zero are reported differently.
      #
      # `npm audit` queries a third party's advisories endpoint, so their outage
      # failed our build -- a gate nobody chose, which arrived by being the
      # default. `make audit` now exits 1 for findings and 2 for an audit that
      # never completed, decided by whether a report body came back rather than by
      # matching npm's error text, which cannot cover an HTTP 429, a 5xx, a TLS
      # failure and every other shape an outage takes.
      #
      # Anything that must block belongs in the Go vulnerability scan or the Trivy
      # image gate, which query nothing at build time that we do not host.
      # The verdict is read from AUDIT_STATUS_FILE, not from make's exit code:
      # GNU make returns 2 for ANY failed recipe, so a gate exit of 1 (findings)
      # and 2 (no audit ran) arrive here identically, and classifying on the
      # process status would label every real advisory "could not run".
      - name: Frontend vulnerability scan
        env:
          AUDIT_STATUS_FILE: ${{ runner.temp }}/audit-status
        run: |
          make audit || true
          rc=$(cat "$AUDIT_STATUS_FILE" 2>/dev/null || echo missing)
          case "$rc" in
            0) ;;
            1) echo "::warning title=npm audit findings::dependencies have advisories at or above low (non-blocking)" ;;
            2) echo "::warning title=npm audit could not run::the advisory endpoint returned no report; this is not a finding" ;;
            *) echo "::warning title=npm audit::the gate recorded no verdict ($rc); treat this step as not having run" ;;
          esac

      # Runs via the Makefile rather than the gosec action so the rule policy
      # (which exclusions, and why) lives in one place that `make ci` also uses.
      # With the action, CI and local runs drift the moment either changes.
      - name: Static analysis (gosec)
        run: make gosec

  test:
    name: Unit Tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # `make vet`, `make lint` and `make test` run in every build shape the
      # project ships (the Makefile's BUILD_SHAPES), and the desktop shapes link
      # GTK and WebKit -- so this job needs the packages the Build job installs.
      # Without them the desktop build's own files are compiled by no gate,
      # which is how its test files stopped compiling unseen (#204).
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # CGO is required: pkg/collector imports NVIDIA go-nvml, which does not
      # build with CGO_ENABLED=0. The unit suite runs under -race because two
      # real data races shipped undetected while it did not.
      - name: Run unit tests
        run: make test

      - name: Coverage report
        run: |
          go test ./pkg/... ./cmd/... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -20

      # A failure's diagnostics, kept on both planes (#225). Gitea's runners
      # open upload-artifact's GHES gate and forward the upload to Gitea's own
      # artifact service, so this one pinned action serves github.com and Gitea
      # alike. docs/testing/ci-artifacts.md says where to download it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-test-logs
          path: test-logs/
          retention-days: 7

      # A passing run's output, so it is kept on github.com only: the Gitea
      # plane stores what a failure leaves behind and nothing else (#225,
      # docs/testing/ci-artifacts.md). The action itself runs on both planes.
      - uses: actions/upload-artifact@v7
        if: github.server_url == 'https://github.com'
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Full tier, like every job whose `if:` is the tier test above.
  extensions:
    name: Desktop Extension Tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      # Tiers 1 and 2: the shared modules' unit tests, plus a harness that
      # loads applet.js against stand-in GObject Introspection objects. Both
      # run in-process and need no display. Tier 3 stands up a real Cinnamon
      # session and is too slow for every push -- see the nightly workflow.
      - name: Run extension tests
        run: make test-extensions

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      # The desktop build links GTK and WebKit; the server build does not.
      # Both are built here so a break in either is caught before release.
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build everything
        run: make build

      # Both shapes of the prometheus tag, not just the one `make build`
      # produces. sysmon-server is built WITH it and the desktop binary WITHOUT,
      # so an untagged compile break would otherwise surface only in a desktop
      # release -- and a tag that is compiled one way is not tested (#100).
      - name: Build both prometheus shapes
        run: make build-both

      - name: Verify the server binary runs
        run: |
          ./bin/sysmon-server version
          ./bin/sysmon-server doctor || true

      # A passing run's output, so it is kept on github.com only: the Gitea
      # plane stores what a failure leaves behind and nothing else (#225,
      # docs/testing/ci-artifacts.md). The action itself runs on both planes.
      - uses: actions/upload-artifact@v7
        if: github.server_url == 'https://github.com'
        with:
          name: binaries
          path: bin/
          retention-days: 7

  fips:
    name: FIPS
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    # No `needs`: every job starts at once and CI Passed fails closed on any
    # of them (ci-template v1.14/v1.15, #237).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      # Through make, so a local `make ci` runs the same shapes. The tagged
      # shape matters: pkg/prom encodes protobuf and snappy by hand, so if
      # anything in it reaches a non-approved primitive, this is where it shows
      # (#100).
      - name: Build and unit-test in FIPS mode
        run: make test-fips

      # A failure's diagnostics, kept on both planes (#225). Gitea's runners
      # open upload-artifact's GHES gate and forward the upload to Gitea's own
      # artifact service, so this one pinned action serves github.com and Gitea
      # alike. docs/testing/ci-artifacts.md says where to download it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fips-test-logs
          path: test-logs/
          retention-days: 7

  integration:
    name: Integration Tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # No `needs`: every job starts at once and CI Passed fails closed on any
    # of them (ci-template v1.14/v1.15, #237).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      # Runs inside the container image so smartmontools and dmidecode are
      # present, matching how the suite runs locally.
      - name: Run integration tests
        run: make integration-test

      # A failure's diagnostics, kept on both planes (#225). Gitea's runners
      # open upload-artifact's GHES gate and forward the upload to Gitea's own
      # artifact service, so this one pinned action serves github.com and Gitea
      # alike. docs/testing/ci-artifacts.md says where to download it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-logs
          path: test-logs/
          retention-days: 7

  e2e:
    name: Browser Tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    # No `needs`: every job starts at once and CI Passed fails closed on any
    # of them (ci-template v1.14/v1.15, #237).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      # Through `make frontend-deps`, not a bare `npm ci`: build-frontend and
      # check-bundle-current key off an install stamp, and an install that does not
      # create it makes the next make target run npm ci all over again -- a second
      # full delete-and-reinstall of node_modules per job.
      - name: Install browser dependencies
        run: make frontend-deps

      - name: Install Playwright browsers
        working-directory: cmd/sysmon/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: make test-e2e

      # test-results/ holds each failed test's screenshot, error-context.md and
      # retry trace (playwright.config.ts).
      # A failure's diagnostics, kept on both planes (#225). Gitea's runners
      # open upload-artifact's GHES gate and forward the upload to Gitea's own
      # artifact service, so this one pinned action serves github.com and Gitea
      # alike. docs/testing/ci-artifacts.md says where to download it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: cmd/sysmon/frontend/test-results/
          retention-days: 7

  bundle:
    name: Bundle Currency
    runs-on: ubuntu-latest
    # No `needs`: every job starts at once and CI Passed fails closed on any
    # of them (ci-template v1.14/v1.15, #237).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      # No separate `npm ci` step: `make check-bundle-current` installs the
      # toolchain itself, keyed to the lockfile. Installing here as well meant two
      # full installs per job, because npm ci deletes and recreates node_modules
      # and the workflow's copy does not create the stamp the Makefile keys on.
      # setup-node's cache above still makes the one install fast.
      #
      # Its own job rather than part of Format/Vet/Lint: this needs the node
      # toolchain, and requiring node to lint Go would reintroduce the dependency
      # the committed bundle exists to remove. A failure here also needs to say
      # "the bundle is stale", which a job named for linting would not.
      - name: Committed bundle matches its source
        run: make check-bundle-current

  # Builds the image on every full-tier run without publishing it, so a broken
  # Dockerfile is caught on main rather than at tag time when a release is
  # already half-built.
  image:
    name: Container Image
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    # No `needs`: every job starts at once and CI Passed fails closed on any
    # of them (ci-template v1.14/v1.15, #237).
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # type=gha is the GitHub Actions cache service. Gitea runs its own, but
      # the job container cannot reach the address act_runner advertises, and
      # buildx fails the whole build on a cache timeout rather than carrying on
      # without it. The cache is an optimisation, so it is switched off where
      # it does not work instead of costing us the job.
      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: go-sysmon:ci
          cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
          cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}

      # Trivy runs from its own image rather than an action: actions that
      # install themselves through a nested checkout resolve against whichever
      # server is running the job, so they work on GitHub and fail on a
      # self-hosted runner. This behaves the same on both.
      - name: Scan the image and its binaries
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --no-progress \
              --format json \
              go-sysmon:ci > trivy-results.json

      # Findings with a fix available fail the build; findings the distribution
      # has not patched are reported and do not. Blocking on unfixable CVEs
      # would wedge every build on something no change of ours can resolve,
      # which teaches everyone to ignore the scanner.
      # Findings with a fix available fail the build; findings the distribution
      # has not patched are reported and do not. Blocking on unfixable CVEs
      # would wedge every build on something no change of ours can resolve,
      # which teaches everyone to ignore the scanner.
      - name: Fail on fixable findings
        run: python3 scripts/trivy-gate.py trivy-results.json

      # A container that starts but cannot see the host is the failure mode
      # worth catching, so this asserts on what it actually reports.
      - name: Verify it sees the host
        run: |
          docker run --rm --pid=host --network=host \
            -v /sys:/sys:ro -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            go-sysmon:ci --json > /tmp/snap.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/snap.json'))
          procs = d['processes']['total']
          cpus = len(d['cpus'])
          assert procs > 5, f"only {procs} processes: --pid=host is not working"
          assert cpus > 0, "no CPUs reported"
          print(f"OK: {procs} processes, {cpus} cpus, host={d['host']['hostname']}")
          PY

  # A single required check for branch protection. Adding a job means adding it
  # to BOTH `needs` and the results line below -- the object-filter shortcut
  # that avoided this is unusable, see the comment on the step.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [lint, test, bundle, build, security, extensions, fips, image, integration, e2e]
    if: always()
    steps:
      # Each job is read BY NAME rather than through join(needs.*.result).
      # That object filter is a GitHub extension: on Gitea it evaluates to an
      # EMPTY STRING, so a grep over it matched nothing and this gate reported
      # "All CI jobs succeeded" while Browser Tests had failed. A gate that
      # passes vacuously is worse than no gate at all.
      #
      # A PR-tier job passes on `success` alone; an unreadable (empty) result
      # fails, and so does `skipped` (#237): a job that never ran proved
      # nothing. A full-tier job may also be `skipped`, but only when this run
      # did not ask for the full tier (FULL_TIER, the tier test at the top of
      # the file). Skipped in a full-tier run means its `if:` and this test
      # disagree, and that fails closed too.
      #
      # Expression strings must also be single-quoted -- GitHub rejects double
      # quotes and invalidates the whole file before any job starts.
      - name: Verify every job succeeded
        env:
          FULL_TIER: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          check() { case "$2" in
            success) echo "OK   $1";;
            skipped) echo "SKIP $1 (did not run -- see its job)"; BAD=1;;
            '')      echo "FAIL $1 (result unreadable)"; BAD=1;;
            *)       echo "FAIL $1 ($2)"; BAD=1;;
          esac; }
          full() {
            if [ "$2" = skipped ] && [ "$FULL_TIER" = false ]; then
              echo "--   $1 (full tier, not requested)"
            else
              check "$1" "$2"
            fi; }
          BAD=0
          echo "Full tier requested: $FULL_TIER"
          check lint        "${{ needs.lint.result }}"
          check test        "${{ needs.test.result }}"
          check bundle      "${{ needs.bundle.result }}"
          check build       "${{ needs.build.result }}"
          full  security    "${{ needs.security.result }}"
          full  extensions  "${{ needs.extensions.result }}"
          full  fips        "${{ needs.fips.result }}"
          full  image       "${{ needs.image.result }}"
          full  integration "${{ needs.integration.result }}"
          full  e2e         "${{ needs.e2e.result }}"
          if [ "$BAD" -ne 0 ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All CI jobs succeeded."
