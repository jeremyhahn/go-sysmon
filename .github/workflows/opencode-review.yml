# code-review-template: v4 — automated peer review on EVERY pull request.
# v2 gated the job on a `code-review` label and could skip itself green;
# see the note on the job below. v4 adds the concurrency and guard fix.
#
# NOTE ON THE STAMP. There were briefly TWO different files stamped v3: the
# 17 deployed copies (carrying the skip-itself-green fix) and this template
# (which did not). They differed in the one line deciding whether an
# unreviewed PR can merge, and a drift check comparing STAMPS reports two
# such files as in agreement. This file is now built FROM the deployed
# copies rather than from its own previous contents. See automatethethings#88.
# Source of truth: software/templates/github-actions/opencode-review.yml in
# the company repo -- INTENT, not a measurement. On 2026-09-07 this file was
# the stalest copy of itself in the fleet while saying exactly this line.
# Before editing it, diff it against a deployed copy (automatethethings#89).
# Gitea-only by design.
#
# ONE REVIEWER: opencode, running a LOCAL model on gpu-host's GPU. Owner ruling
# 2026-09-06, in his words: "i dont want any CODEX tokens minted or any api
# usage for frontier models. when the codex subscription is expired then we
# dont use it! we use opencode with whatever model is specified in the gitea
# labels or we default to the qwen 3.6 model!" The v1 `model:codex` branch is
# removed: no frontier-model API is called from CI, and no Codex credential is
# published to any repository.
#
# MODEL SELECTION IS BY LABEL, and every candidate is a literal below — a
# repository chooses from the company-authored set and can never name an
# arbitrary model from label text:
#   code-review                      -> qwen3.8:27b-64k          (default)
#   code-review + model:qwen3.6      -> qwen3.6:27b-coding-64k   (previous default)
#   code-review + model:qwen-122b    -> qwen3.5:122b
#   code-review + model:coder-next   -> qwen3-coder-next
#
# RUNNER LABEL: `code-review` means "this runner holds the review assets and
# can reach Ollama" — it carries no model name, so adding a model is one
# literal here rather than a whole new registered runner.
name: Code Review

on:
  # Every pull_request event reviews the head it names. `labeled` is kept so
  # that adding a `model:*` label re-reviews under the model just chosen;
  # `synchronize` is what stops a new commit from inheriting the previous
  # head's verdict.
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# Creating a PR that already carries the label fires `opened` AND `labeled`, so
# TWO runs exist for ONE head. v3 keyed the group on the PR number alone and
# cancelled the loser, which had two costs measured on 2026-09-06:
#
#   1. Gitea maps a cancelled job to commit status `failure`, written under the
#      SAME context name the survivor will use. A healthy PR carried a red
#      required check meaning "superseded", not "broken" (go-sysmon PR#122,
#      runs 13001/13002, same head f38cebb7, created in the same second).
#      "Prefer the newest status per context" does not rescue this: the newest
#      status WAS the cancelled run's `failure`, one second newer than the
#      survivor's `pending`, written by a run that will never report again.
#      The sound rule: a status whose run ended `cancelled` is SUPERSEDED,
#      not a verdict.
#   2. Cancellation did not reliably prevent the duplicate anyway. go-sysmon
#      PR#122 and PR#113 each carry TWO `opencode` APPROVED reviews on one
#      commit, 11 and 19 minutes apart -- two full GPU reviews of one head.
#
# So: key on the head sha, so runs for different heads never contend, and drop
# the cancellation. `cancel-in-progress` is OMITTED rather than set to `false`
# because Gitea 1.27.1 does not evaluate expressions in that field and treats
# any non-empty value as truthy; omitting it takes the `false` default without
# depending on how a literal is parsed. The group key DOES evaluate
# expressions -- that asymmetry is why one is written and the other is not.
#
# Nothing is cancelled now, so the guard step below is what stops a stale or
# duplicate run before it spends 45 minutes of GPU.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

jobs:
  review:
    name: Code Review (opencode)
    # NO job-level `if:` HERE, DELIBERATELY. A job-level condition that
    # evaluates false concludes the job `skipped`, and Gitea counts a `skipped`
    # commit status as SUCCESS when it combines the required checks
    # (modules/commitstatus/commit_status.go, CommitStatusStates.Combine). The
    # required `Code Review / Code Review (opencode)` context was therefore
    # SATISFIED by a review that never ran.
    #
    # MEASURED, go-trusted-platform #536 (2026-09-06): the PR was pushed at
    # 13:00:36 and labelled one second later, so run 12729 stored a payload
    # with no `code-review` label on it. Its genuine sibling went red. At
    # 13:32:17 run 12729 was re-run; a re-run replays that run's OWN stored
    # payload, the label was still absent from it, the job skipped in zero
    # seconds, and that `skipped` became the last status on the context. The
    # PR merged at 13:34:04 with zero reviews at any commit.
    #
    # The label is no longer a condition on reviewing at all: EVERY pull
    # request is reviewed, which is also what "run the review automatically
    # whenever one is needed" requires. `model:*` labels still select the
    # model. The mirror guard moved onto the STEPS, where a false condition
    # skips a step but leaves the job's own conclusion real.
    runs-on: code-review
    timeout-minutes: 45
    steps:
      # Runs BEFORE checkout so a stale or duplicate run costs a few API calls
      # rather than a clone and a 45-minute review.
      #
      # This is a STEP, not a job-level condition, for the same reason the job
      # carries no `if:` -- see the note above. A step that skips leaves the
      # job's own conclusion real; a job that skips is counted as success.
      #
      # It must never turn a rejection into a pass. A run that finds an existing
      # verdict for this exact head exits WITH that verdict -- 0 for an approval,
      # non-zero for anything else -- so the required context keeps saying what
      # the real review said. Exiting 0 unconditionally would let a duplicate
      # overwrite a rejection with green, which is strictly worse than the red
      # check this guard exists to remove.
      - name: Skip if this head is stale or already reviewed
        id: guard
        if: github.server_url != 'https://github.com'
        env:
          BOT: ${{ secrets.OPENCODE_BOT_TOKEN }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          BOT_USER: opencode
        run: |
          set -euo pipefail

          # Fail closed: an unreadable head must not be treated as "unchanged".
          head=$(curl -sS -H "Authorization: token $BOT" "$REPO_API/pulls/$PR_NUM" \
                 | jq -r '.head.sha // empty')
          [ -n "$head" ] || { echo "::error::could not read the head of PR $PR_NUM"; exit 1; }

          if [ "$head" != "$EVENT_SHA" ]; then
            echo "Head has moved to ${head} since this run was created for ${EVENT_SHA}."
            echo "This run would review an abandoned commit, and its status lands on"
            echo "that commit -- not on the PR head, so it gates nothing. Stopping."
            echo "skip=stale" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Adding a `model:*` label is a DELIBERATE request to review this same
          # head again under the model just chosen -- it is the entire reason
          # `labeled` is a trigger (see the note on `on:` above). It must
          # therefore bypass the already-reviewed check below, which would
          # otherwise see the previous model's approval and skip, silently
          # defeating the feature the trigger exists for.
          #
          # `code-review` is NOT such a label: it is the other half of the
          # opened/labeled pair this guard exists to de-duplicate.
          case "${EVENT_ACTION}:${EVENT_LABEL}" in
            labeled:model:*)
              echo "A ${EVENT_LABEL} label was just added. Re-reviewing $EVENT_SHA"
              echo "under the model it selects, which is what \`labeled\` is for."
              exit 0
              ;;
          esac

          # `last` because a PR accumulates reviews; the newest for THIS commit
          # is the one that speaks for it.
          state=$(curl -sS -H "Authorization: token $BOT" "$REPO_API/pulls/$PR_NUM/reviews" \
                  | jq -r --arg u "$BOT_USER" --arg s "$EVENT_SHA" \
                      '[ .[] | select(.user.login == $u and .commit_id == $s) ] | last | .state // ""')

          case "$state" in
            "")
              echo "No $BOT_USER verdict on $EVENT_SHA yet. Reviewing."
              ;;
            APPROVED)
              echo "$BOT_USER already approved $EVENT_SHA -- this is the duplicate"
              echo "run from the opened/labeled pair. Not reviewing it twice."
              echo "skip=reviewed" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::$BOT_USER already returned $state on $EVENT_SHA."
              echo "Failing so that verdict stands: a duplicate must not overwrite"
              echo "a rejection with a pass."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v6
        if: github.server_url != 'https://github.com' && steps.guard.outputs.skip == ''
        with:
          fetch-depth: 0

      - name: Run the peer review
        if: github.server_url != 'https://github.com' && steps.guard.outputs.skip == ''
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_CODEX_TOKEN: ${{ secrets.OPENCODE_BOT_TOKEN }}
          REVIEW_BOT_USER: opencode
          REVIEW_ENGINE: qwen
          OLLAMA_URL: http://198.51.100.91:11434
          OLLAMA_MODEL: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'model:qwen-122b') && 'qwen3.5:122b'
             || contains(github.event.pull_request.labels.*.name, 'model:coder-next') && 'qwen3-coder-next:latest'
             || contains(github.event.pull_request.labels.*.name, 'model:qwen3.6') && 'qwen3.6:27b-coding-64k'
             || 'qwen3.8:27b-64k' }}
        run: /opt/qwen-review/pr-review.sh

      # Auto-merge is NOT armed here. It is armed once, when the PR opens
      # (automerge.yml), so a failed review cannot leave a PR unarmed and
      # forgotten. Gitea merges when its required checks pass -- and this
      # review is one of them.
