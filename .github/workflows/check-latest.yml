name: Check Latest

# Every pin tracks the latest stable release. Once a day this runs
# `make check-latest`, and when any pin lags (Go, a dev tool, Node.js LTS, the
# Debian or Ubuntu base release, an action a workflow uses, or a GitHub-hosted
# runner label) it files one task:ready issue, none while an earlier one is open.
#
# It never fails an unrelated PR. An upstream release is not a defect in
# anyone's change, so the online check is not in `make lint` or ci.yml, and
# this workflow runs on a PR only when the PR changes the check itself -- and
# then as a dry run, which prints the issue it would file and files nothing.
# (The offline half, `make check-pins`, is in lint: disagreeing pins are a
# defect in the change that introduced them.)
#
# The run goes red only when an item could not be checked (exit 2): a lag is
# reported through the issue, but a check that cannot reach go.dev or the
# module proxy must not look like "everything is current".

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issue that would be filed instead of filing it
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/check-latest.yml'
      - 'cmd/checklatest/**'
      - 'internal/pins/**'
      - 'internal/github/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: check-latest-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod

jobs:
  check-latest:
    name: Go and dev tools at their latest release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Check, and file an issue for anything that lags
        env:
          # The workflow's own token, scoped by the permissions above.
          # checklatest refuses to run with it empty rather than calling the
          # API anonymously. GITHUB_API_URL is the runner's own.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          make check-latest CHECK_LATEST_FLAGS="-file-issue -dry-run=$DRY_RUN -github-api $GITHUB_API_URL -repo $REPO -run-url $RUN_URL"
