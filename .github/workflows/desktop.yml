name: Desktop Tests

# Tier 3 of the desktop test strategy: a real Cinnamon session on headless Xorg,
# driven through the org.Cinnamon D-Bus Eval method. Tiers 1 and 2 run on every
# full-tier run of ci.yml; this one needs a Cinnamon install and software GL, so
# it takes minutes and is not perfectly reliable. On demand (the coordinator
# dispatches it nightly; no workflow has a `schedule:`, #267), plus whenever the
# extension sources actually change.
#
# See docs/testing/desktop.md for what each tier proves.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extensions/**'
      - 'test/desktop/**'
      - 'pkg/server/**'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cinnamon:
    name: Cinnamon Applet (real session)
    runs-on: ubuntu-latest
    # Building the image pulls a full Cinnamon desktop; the run itself waits on
    # a compositor starting under llvmpipe.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build the desktop test image
        run: make desktop-docker-build

      - name: Run the Cinnamon applet tests
        run: make test-extensions-desktop

      # The session's logs -- cinnamon.log, xorg.log, the system bus and udisksd
      # logs, and the runner's own output -- which make copies out of the
      # container (#225). Gitea's runners open upload-artifact's GHES gate and
      # forward the upload to Gitea's own artifact service, so this one pinned
      # action serves github.com and Gitea alike. docs/testing/ci-artifacts.md
      # says where to download it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-session-logs
          path: test-logs/desktop/
          retention-days: 7
