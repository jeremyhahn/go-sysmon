name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write
  packages: write

env:
  GO_VERSION_FILE: go.mod
  # .node-version pins the exact Node.js release (the latest LTS), the same
  # way go.mod pins Go; the Dockerfile's node image repeats it, and
  # `make check-pins` fails if the two disagree.
  NODE_VERSION_FILE: .node-version

jobs:
  verify:
    name: Verify Before Release
    runs-on: ubuntu-latest
    # The one place the release is resolved. Every later job builds and
    # publishes exactly this tag and commit, and each publishing job confirms
    # that the tag still names the commit before it publishes.
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A manual run releases the tag it names, so that tag is what is verified.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('refs/tags/{0}', inputs.version) || github.ref }}
          # Full history, so the check below can prove the commit is on main.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      # Every analysis tool `make ci-fast` reaches for is pinned once, in the
      # Makefile, and verified by version before it runs. The runner image
      # bakes them; `make tools` uses a baked copy at the pinned version as-is
      # and installs the pin into GOBIN otherwise. Installing over the network
      # on every run is a confusing way to lose a release -- a checksum-server
      # timeout failed CI twice in one day with nothing wrong with the code
      # (#39) -- so a current image means nothing is fetched here. Either way
      # the step prints the exact version of each tool that cleared the release.
      - name: Analysis tools
        run: make tools

      # Through make, so the install stamp exists and `make ci-fast` below does not
      # repeat it. See the note on the same step in ci.yml.
      - name: Install frontend dependencies
        run: make frontend-deps

      # `make ci-fast` ends in `make build`, which builds the DESKTOP binary
      # too -- and that links GTK and WebKit through cgo. Without these headers
      # the gate dies in the compiler rather than on a real finding. Every
      # other job that runs `make build` installs them; this one was the
      # exception, which is exactly why v0.1.0 failed here.
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # Nothing is published unless lint, vulnerability scans and the race
      # suite pass. The container and browser suites are covered by CI on the
      # commit being tagged.
      # Before anything is built: a tag whose CHANGELOG section is missing, or
      # that leaves changelog.d fragments unassembled, must not publish.
      # The tag reaches the shell through env, never pasted into the script:
      # git accepts tags containing shell syntax. check-changelog validates its
      # shape before anything is exported to the later jobs.
      - name: Resolve and check the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          make check-changelog RELEASE="${RELEASE_TAG}"
          # Every release is a tag on main (release-versioning.md §1a). A tag
          # on an unmerged branch would publish code that never merged, and a
          # published tag can't be taken back.
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::${RELEASE_TAG} names $(git rev-parse HEAD), which is not on main. Merge it, then tag the commit on main."
            exit 1
          }
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Run the release gate
        run: make ci-fast

  build:
    name: Build (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ (github.server_url == 'https://github.com' && matrix.runner) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      # arm64 builds natively on an ARM runner rather than cross-compiling: CGO
      # is mandatory (NVIDIA NVML), and a native toolchain avoids maintaining a
      # cross-compilation setup for a cgo dependency.
      #
      # That runner label only exists on GitHub. A self-hosted Gitea runner
      # advertises ubuntu-latest and ubuntu-22.04, so an arm64 leg there is
      # never scheduled -- it sits in "waiting" forever and the run never
      # finishes, even though every other job succeeded and the release
      # published. So the matrix itself drops arm64 off GitHub rather than
      # queueing work nothing can pick up.
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm

    # Whether this leg runs on the architecture it targets. Off GitHub there is
    # no arm64 runner, so the arm64 leg lands on an amd64 host: installing
    # arm64 GTK and executing the built binary would both be wrong, so its
    # steps are skipped. A job-level `if` cannot express this -- GitHub does
    # not expose the matrix context to one.
    env:
      NATIVE: ${{ matrix.arch == 'amd64' || github.server_url == 'https://github.com' }}

    steps:
      - uses: actions/checkout@v7
        if: env.NATIVE == 'true'
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@v7
        if: env.NATIVE == 'true'
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        if: env.NATIVE == 'true'
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: cmd/sysmon/frontend/package-lock.json

      - name: Install desktop build dependencies
        if: env.NATIVE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # The server binary is the portable artifact: 3 shared libraries, runs on
      # a headless host. The desktop binary additionally links GTK and WebKit
      # and only runs where those are installed.
      - name: Build release binaries
        if: env.NATIVE == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          make release-build VERSION="${VERSION}"
          make release-build-desktop VERSION="${VERSION}"

      - name: Verify the binaries run
        if: env.NATIVE == 'true'
        run: |
          for b in dist/sysmon-server-*-linux-*; do
            case "$b" in *.sha256) continue;; esac
            "$b" version
          done

      # The hand-off to the publish job, which is GitHub-only because it talks
      # to the GitHub Releases API. On Gitea nothing would download this, so it
      # is not uploaded there: gitea-release below builds and publishes in one
      # job. The binaries are still built and verified on Gitea.
      - uses: actions/upload-artifact@v7
        if: github.server_url == 'https://github.com'
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  # Images are built on the SAME native runners as the binaries rather than
  # under QEMU. A cgo build (NVML) through emulation is slow enough to dominate
  # the whole release, and it is avoidable when native arm64 runners exist.
  #
  # Each runner pushes by digest only; the manifest list that ties them into
  # one multi-arch tag is assembled afterwards.
  image:
    name: Image (${{ matrix.arch }})
    # ghcr.io and its GITHUB_TOKEN credential only exist on GitHub, and the
    # buildx `type=gha` cache is unreachable from Gitea's job containers. On
    # Gitea this job is skipped rather than failing the release; gitea-release
    # pushes the image to Gitea's own registry instead.
    if: github.server_url == 'https://github.com'
    needs: verify
    # Docker jobs run on the release-only runner on Gitea: no PR job lands there.
    runs-on: ${{ github.server_url == 'https://github.com' && matrix.runner || 'release' }}
    strategy:
      fail-fast: false
      # Written out literally for the same reason as the build matrix: Gitea
      # does not expand a computed `include`. The whole job is GitHub-only,
      # and runs-on resolves to a schedulable label elsewhere so the `if`
      # above is actually reached and skips it.
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-buildx-action@v4
        with:
          # moby/buildkit:buildx-stable-1 as of 2026-10-25
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            GIT_COMMIT=${{ needs.verify.outputs.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # The digest is the only thing the manifest step needs, and artifact
      # names must not collide between matrix legs.
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          # The build output is "sha256:<hex>". Artifact filenames cannot
          # contain a colon, so strip the algorithm prefix -- which is also
          # what the manifest step expects when it rebuilds the reference as
          # "${IMAGE}@sha256:${digest}".
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  image-manifest:
    name: Publish Image Manifest
    if: github.server_url == 'https://github.com'
    needs: [verify, image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'release' }}
    steps:
      # Checked out only so the tag can be confirmed before it is published.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
        with:
          # moby/buildkit:buildx-stable-1 as of 2026-10-25
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the tag still names the verified commit
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash .github/scripts/confirm-release-ref.sh

      # ghcr requires a lowercase repository path; github.repository already is
      # for this repo, but tolower keeps it correct if the owner ever changes.
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ needs.verify.outputs.version }}"
          # :latest is the stable image. An -alpha release is a pre-release
          # and never moves it.
          tags=(-t "${IMAGE}:${VERSION}")
          case "${VERSION}" in
            *-alpha) ;;
            *) tags+=(-t "${IMAGE}:latest") ;;
          esac
          # One digest file per architecture, named for the digest. Collect
          # them into an array rather than relying on an unquoted expansion to
          # word-split, which is what shellcheck objects to (SC2046) and is
          # genuinely fragile.
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  publish:
    name: Publish Release
    # softprops/action-gh-release talks to the GitHub Releases API.
    if: github.server_url == 'https://github.com'
    needs: [verify, build, image-manifest]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'release' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Write release notes
        run: |
          cat > NOTES.md <<'EOF'
          ## Installation

          `sysmon-server` is the portable build: it links only libc, runs on a
          headless host, and embeds the web dashboard. This is the one to
          deploy to servers.

          ```bash
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ needs.verify.outputs.tag }}/sysmon-server-${{ needs.verify.outputs.version }}-linux-amd64
          chmod +x sysmon-server-*
          sudo install -m 0755 sysmon-server-* /usr/local/bin/sysmon-server
          sysmon-server serve --addr :8080
          ```

          `sysmon` is the desktop build. It does everything the server build
          does and adds a native GUI window, but links GTK and WebKit and will
          not start without them:

          ```bash
          sudo apt install libgtk-3-0 libwebkit2gtk-4.1-0 libsoup-3.0-0
          ```

          Run `sysmon doctor` on any host to see what that build can do there
          and how to fix anything missing.

          ### Container

          ```bash
          docker run -d --name sysmon \
            --pid=host --network=host \
            -v /sys:/sys:ro -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }} \
            serve --addr :8080
          ```

          linux/amd64 and linux/arm64. The host flags are not optional: without
          them the container reports itself (1 process, its own veth) rather
          than the host. Add `--privileged` for SMART disk health -- capabilities
          alone are not sufficient. See docs/server/container.md.

          ### Verifying a download

          ```bash
          sha256sum -c sysmon-server-${{ needs.verify.outputs.version }}-linux-amd64.sha256
          ```

          ### Note on the dashboard

          The web dashboard has no authentication. It exposes hostnames, the
          process list, disk serial numbers and network configuration. Bind it
          to a private interface
          (`--addr 10.0.0.5:8080`) or put an authenticating proxy in front of
          it before exposing it to an untrusted network.
          EOF

      - name: Confirm the tag still names the verified commit
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash .github/scripts/confirm-release-ref.sh

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: go-sysmon ${{ needs.verify.outputs.tag }}
          body_path: NOTES.md
          files: artifacts/*
          draft: false
          prerelease: ${{ endsWith(needs.verify.outputs.tag, '-alpha') }}
          generate_release_notes: true

  # The Gitea equivalent of build + image + publish, in one job.
  #
  # It cannot reuse the jobs above: they publish to ghcr.io and the GitHub
  # Releases API, which Gitea does not have.
  #
  # Single architecture, because no Gitea runner advertises an arm64 label (see
  # the build matrix above). GitHub produces amd64 and arm64 from native
  # runners; here you get the runner's own architecture. With one architecture
  # there is nothing to hand between jobs, so this builds, pushes and publishes
  # in a single job and does not depend on the artifact service at all. Gitea's runners do carry artifacts
  # (docs/testing/ci-artifacts.md), but only through each runner's cache
  # server, so a release that needed them would fail whenever one is down.
  gitea-release:
    name: Gitea Release
    needs: verify
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Resolve the instance
        id: meta
        run: |
          {
            # github.server_url is the Gitea instance; the registry is the same
            # host and port with the scheme stripped.
            server="${{ github.server_url }}"
            echo "registry=${server#*://}"
            echo "api=${server}/api/v1"
          } >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          make release-build VERSION="${{ needs.verify.outputs.version }}"
          make release-build-desktop VERSION="${{ needs.verify.outputs.version }}"

      - name: Verify the binaries run
        run: |
          for b in dist/sysmon-server-*-linux-*; do
            case "$b" in *.sha256) continue;; esac
            "$b" version
          done

      # Gitea's built-in container registry. Over plain HTTP this needs
      # insecure-registries on the pushing daemon and on every daemon that
      # pulls, so it is allowed to fail without losing the binary release --
      # see infra/gitea/docs/lessons.md.
      - name: Push the container image
        continue-on-error: true
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          VERSION: ${{ needs.verify.outputs.version }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash .github/scripts/gitea-image.sh

      - name: Confirm the tag still names the verified commit
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash .github/scripts/confirm-release-ref.sh

      - name: Publish the release
        env:
          GITEA_API: ${{ steps.meta.outputs.api }}
          GITEA_REPO: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: bash .github/scripts/gitea-release.sh
