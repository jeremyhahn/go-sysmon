# Dependabot keeps every dependency at its latest stable release. It opens one
# grouped PR per ecosystem a day, and CI gates it like any other PR.
#
# The Go toolchain and Node.js are pinned in pairs that Dependabot cannot move
# together: go.mod's go directive with the golang images, and .node-version
# with the node image. `make check-pins` fails when either pair disagrees, so
# those images are ignored here and `make check-latest` reports them instead,
# alongside the Makefile's tool pins (golangci-lint, gosec, govulncheck,
# actionlint), which no Dependabot ecosystem covers.
#
# Every update PR is opened with `ci:full`, so CI runs its full tier on it
# (security, FIPS, integration, browser, desktop and container image jobs) and
# CI Passed covers all of it before dependabot-automerge.yml lets it merge. A
# merge that auto-merge makes with GITHUB_TOKEN starts no CI run on main, so the
# PR's own run is the only one these changes get.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, "ci:full"]
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /cmd/sysmon/frontend
    schedule:
      interval: daily
    labels: [dependencies, "ci:full"]
    # package.json pins exact versions; keep it that way.
    versioning-strategy: increase
    ignore:
      # TypeScript 7 waits for svelte-check. As of
      # svelte-check 4.7.8 its peer range is TypeScript ^5 || ^6, and running
      # it on 7 needs TypeScript 6 and 7 installed side by side plus a --tsgo
      # flag it calls experimental. Remove this once a svelte-check release
      # lists TypeScript 7 in its peerDependencies.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels: [dependencies, "ci:full"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /build/docker/devcontainer
      - /test/desktop
    schedule:
      interval: daily
    labels: [dependencies, "ci:full"]
    ignore:
      - dependency-name: golang
      - dependency-name: node
    groups:
      images:
        patterns: ["*"]
