# actionlint only knows GitHub's hosted runner labels, so every label served by
# a self-hosted runner has to be declared here or `runs-on:` fails the lint.
# `release` is the release runner (rulings 169, 173): the only runner that
# pushes to the Gitea registry. The other two are company review runners on the
# Gitea plane (conventions/sdlc.md §8): `codex` mounts the Codex review
# credential, `claude` the Claude session credential. Source of truth for the workflows that use them:
# software/templates/github-actions/ in the automatethethings repo.
self-hosted-runner:
  labels:
    - claude
    - code-review
    - codex
    - release

# AUTOMERGE_APPROVERS_ONLY is an optional repository variable: the approver
# list for a restricted repo, read by the automerge workflow template. Any
# other `vars.*` reference is a typo.
config-variables:
  - AUTOMERGE_APPROVERS_ONLY
