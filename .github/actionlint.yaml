# Every workflow runs on GitHub-hosted runners. actionlint checks each
# `runs-on:` label against its own list of hosted labels, and that list lags
# GitHub's: actionlint v1.7.12 stops at ubuntu-24.04-arm. The labels below are
# GitHub-hosted runners actionlint does not know yet, declared here so the lint
# still fails on any other unknown label. They are the HOSTED_RUNNER_RELEASE
# labels the Makefile pins (`make check-pins` checks each workflow's use of
# them); remove an entry once actionlint lists it.
self-hosted-runner:
  labels:
    - ubuntu-26.04-arm

# No workflow reads a repository variable, so an empty list makes any `vars.*`
# reference a lint failure rather than a silently empty value.
config-variables: []
