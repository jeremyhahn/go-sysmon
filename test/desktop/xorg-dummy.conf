# The X server for the tier 3 desktop tests: Xorg with the dummy video driver.
#
# Xvfb cannot be used. Its single RandR mode has no timings -- dot clock, htotal
# and vtotal are all 0 -- so the refresh rate mutter derives is 0/0, and every
# run logged "Invalid mode 1280x1024 (-nan)". Modes added afterwards with
# `xrandr --newmode` do not survive the xrandr client that created them. The
# dummy driver takes its modes from this file, so the display carries real
# timings from the moment the server starts.
#
# The Modeline is the VESA DMT timing for 1280x1024 at 60 Hz:
# 108 MHz / (1688 x 1066) = 60.02 Hz.

Section "ServerFlags"
    # There is no udev or system bus in the container. Hotplug would only log
    # errors trying to reach them; the core keyboard and pointer still exist.
    Option "AutoAddDevices"    "false"
    Option "AutoEnableDevices" "false"
EndSection

Section "Device"
    Identifier "dummy"
    Driver     "dummy"
    # KiB; enough for 1280x1024 at 32 bpp.
    VideoRam   16384
EndSection

Section "Monitor"
    Identifier  "monitor"
    HorizSync   31.5-81.0
    VertRefresh 56.0-76.0
    Modeline    "1280x1024" 108.00 1280 1328 1440 1688 1024 1025 1028 1066 +hsync +vsync
EndSection

Section "Screen"
    Identifier   "screen"
    Device       "dummy"
    Monitor      "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1280x1024"
        Virtual 1280 1024
    EndSubSection
EndSection
